# AWAI-465 renewer configuration (ConfigMap; not secret). Sourced by
# k8s-run.sh and renew.sh, which require it to be root-owned and not
# group/world-writable.
DOMAIN=ipfs.yataverse.com
# No ACME contact email: Let's Encrypt no longer sends expiry mail, and the
# alert path is the failed Job plus the status file. lego names the account.
ACCOUNT_ID=yataverse-acme
LEGO_VERSION=5.6.0
LEGO_TARBALL_SHA256=f02fc11b6f56b97e387fa7caa0268f86f5a336953b22458e6430e4651fea439a   # lego_v5.6.0_linux_amd64.tar.gz, release checksums.txt
LEGO_SHA256=9ba1a7f9ed951e6a506cf7581fcb0373ee3ae9b6fd58d4572a08400c1e905ba8          # the lego binary inside it
LEGO_BIN=/state/bin/lego-5.6.0
STATE_DIR=/state
DNS_PROVIDER=cloudflare
DNS_RESOLVERS=1.1.1.1:53,8.8.8.8:53
RENEW_DAYS=30
ALERT_DAYS=21
SERVER_production=https://acme-v02.api.letsencrypt.org/directory
SERVER_staging=https://acme-staging-v02.api.letsencrypt.org/directory
CHAIN_CA_production=system
CHAIN_CA_staging=/etc/yataverse-acme/le-staging-roots.pem
SSH_BIN=/usr/bin/ssh
KNOWN_HOSTS=/etc/yataverse-acme/known_hosts
SSH_PROXY_COMMAND="/ts-bin/tailscale --socket=/ts-run/tailscaled.sock nc %h %p"
# name=user@tailnet-host, space separated. Empty until a target is enrolled
# (receiver installed, its host key in known_hosts).
TARGETS=""
